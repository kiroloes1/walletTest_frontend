        <style>

 }
  /* --- Custom Scrollbar Styling --- */

/* 1. السكرول بار نفسه (العرض والارتفاع) */
::-webkit-scrollbar {
  width: 6px;  /* خليه نحيف عشان يبان Modern */
  height: 6px; /* للسكرول الأفقي لو ظهر */
}

/* 2. المجرى (الخلفية اللي بيمشي عليها) */
::-webkit-scrollbar-track {
  background: #F8FAFC; /* نفس لون خلفية الصفحة عندك */
  border-radius: 100px;
}

/* 3. القبضة (الجزء اللي بيتحرك) */
::-webkit-scrollbar-thumb {
  background: #E2E8F0; /* لون هادي مش فاقع */
  border-radius: 100px;
  transition: all 0.3s ease;
}

/* 4. عند الوقوف بالماوس (Hover) */
::-webkit-scrollbar-thumb:hover {
  background: #0F172A; /* يقلب كحلي لما المستخدم يلمسه */
}


* {
  scrollbar-width: thin;
  scrollbar-color: #E2E8F0 #F8FAFC;
}
</style>
